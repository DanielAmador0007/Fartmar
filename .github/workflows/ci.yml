name: CI

# Calidad -> pruebas -> imágenes -> staging (simulado en el runner) -> producción
# (aprobación manual). Ver docs/DEPLOY.md.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      confirm_production:
        description: 'Escriba DESPLEGAR para pasar a producción desde una ejecución manual en main (alternativa si el repositorio no admite revisores en environments)'
        required: false
        default: ''
        type: string

# Cancela ejecuciones viejas de la misma rama/PR. En main no: cancelar un
# despliegue a medias es peor que esperar.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  PHP_VERSION: '8.4'
  NODE_VERSION: '24'

jobs:
  backend-lint:
    name: Backend · Pint + Larastan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5

      - name: Configurar PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: pdo_pgsql, intl, pcntl, zip
          coverage: none
          tools: composer:v2
          ini-values: memory_limit=1G

      - name: Directorio de caché de Composer
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Caché de Composer
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-${{ hashFiles('backend/composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Instalar dependencias
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Pint (estilo)
        run: vendor/bin/pint --test

      - name: Larastan (nivel 6)
        run: vendor/bin/phpstan analyse --no-progress --error-format=github

  frontend-lint:
    name: Frontend · ESLint + tsc
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5

      - name: Configurar Node
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - name: ESLint
        run: npm run lint
      - name: TypeScript (tsc --noEmit vía tsc -b)
        run: npm run typecheck

  infra-lint:
    name: Infra · shellcheck + compose config
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: shellcheck de los scripts
        run: shellcheck scripts/*.sh docker/php/*.sh
      - name: docker compose config (producción y desarrollo)
        run: |
          cp .env.example .env
          docker compose config --quiet
          docker compose -f docker-compose.yml -f docker-compose.dev.yml config --quiet

  backend-test:
    name: Backend · Pest (PostgreSQL 16, concurrencia) + eval del asistente
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: fartmar
          # Credencial efímera del contenedor de CI, no es un secreto.
          POSTGRES_PASSWORD: fartmar_ci
          POSTGRES_DB: fartmar_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fartmar -d fartmar_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_USERNAME: fartmar
      DB_PASSWORD: fartmar_ci
      # phpunit.xml fuerza DB_DATABASE=fartmar_test para Pest.
      LLM_PROVIDER: mock

    steps:
      - uses: actions/checkout@v5

      - name: Configurar PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: pdo_pgsql, intl, pcntl, zip
          coverage: none
          tools: composer:v2
          ini-values: memory_limit=1G

      - name: Directorio de caché de Composer
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Caché de Composer
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-${{ hashFiles('backend/composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Instalar dependencias
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Preparar .env y APP_KEY de CI
        run: |
          cp .env.example .env
          php artisan key:generate --no-interaction

      - name: Pest (incluye el grupo concurrency con procesos reales)
        run: vendor/bin/pest --ci

      # El eval lee tests/Assistant/eval.json: corre aquí (con el código
      # fuente) y no en la imagen de producción, que no lleva tests/.
      - name: BD recién sembrada para el eval
        env:
          DB_DATABASE: fartmar_eval
          PGPASSWORD: fartmar_ci
        run: |
          psql -h 127.0.0.1 -U fartmar -d fartmar_test -c 'CREATE DATABASE fartmar_eval'
          php artisan migrate --force --seed --no-interaction

      - name: Eval del asistente IA (mock)
        env:
          DB_DATABASE: fartmar_eval
        run: php artisan assistant:eval --provider=mock

  frontend-test:
    name: Frontend · Vitest
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5

      - name: Configurar Node
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - name: Vitest
        run: npm run test:run

  build-images:
    name: Imágenes Docker (api, web)
    needs: [backend-lint, frontend-lint, infra-lint, backend-test, frontend-test]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    env:
      # Push en main (push o ejecución manual), nunca desde un PR.
      PUSH: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
    steps:
      - uses: actions/checkout@v5

      - name: Nombres de imagen (GHCR exige minúsculas)
        id: names
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "api=ghcr.io/${owner}/fartmar-api" >> "$GITHUB_OUTPUT"
          echo "web=ghcr.io/${owner}/fartmar-web" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Login a GHCR (solo main)
        if: env.PUSH == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Se construye una vez y se carga en el daemon local: el MISMO artefacto
      # se sube a GHCR (main) y se pasa al job de staging.
      - name: Build api
        uses: docker/build-push-action@v6
        with:
          context: backend
          build-contexts: infra=docker
          target: production
          load: true
          tags: |
            fartmar-api:ci
            ${{ steps.names.outputs.api }}:${{ github.sha }}
          labels: org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Build web
        uses: docker/build-push-action@v6
        with:
          context: frontend
          build-contexts: infra=docker
          target: production
          load: true
          tags: |
            fartmar-web:ci
            ${{ steps.names.outputs.web }}:${{ github.sha }}
          labels: org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

      - name: Las imágenes corren sin root y la de la API no lleva tests/
        run: |
          test "$(docker run --rm --entrypoint id fartmar-api:ci -u)" != "0"
          test "$(docker run --rm --entrypoint id fartmar-web:ci -u)" != "0"
          if docker run --rm --entrypoint test fartmar-api:ci -d /app/tests; then
            echo "::error::La imagen de producción incluye tests/"
            exit 1
          fi

      - name: Push a GHCR (tags sha y latest, solo main)
        if: env.PUSH == 'true'
        env:
          API: ${{ steps.names.outputs.api }}
          WEB: ${{ steps.names.outputs.web }}
          SHA: ${{ github.sha }}
        run: |
          for image in "$API" "$WEB"; do
            docker push "${image}:${SHA}"
            docker tag "${image}:${SHA}" "${image}:latest"
            docker push "${image}:latest"
          done

      - name: Exportar imágenes para staging
        run: docker save fartmar-api:ci fartmar-web:ci | gzip > images.tar.gz

      - uses: actions/upload-artifact@v4
        with:
          name: images
          path: images.tar.gz
          retention-days: 3

  deploy-staging:
    name: Staging (simulado en el runner) + smoke test
    needs: build-images
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: staging
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          name: images

      - name: Cargar las imágenes construidas
        run: gunzip -c images.tar.gz | docker load

      - name: Configuración del entorno (demo, sin secretos reales)
        run: |
          cp .env.example .env
          {
            echo "API_IMAGE=fartmar-api:ci"
            echo "WEB_IMAGE=fartmar-web:ci"
          } >> .env

      - name: Despliegue simulado (pasos que se harían en el host)
        run: bash scripts/deploy.sh staging fartmar-api:ci fartmar-web:ci

      - name: Levantar el stack de producción con las imágenes del commit
        run: docker compose up -d --no-build --wait --wait-timeout 300

      - name: Smoke test (/health, /ready, SPA, login, endpoint autenticado)
        run: bash scripts/smoke-test.sh

      - name: Contenedores sin root y rol de BD sin TRUNCATE
        run: |
          test "$(docker compose exec -T api id -u)" != "0"
          test "$(docker compose exec -T web id -u)" != "0"
          if docker compose exec -T db psql -U fartmar_app -d fartmar -c 'TRUNCATE kardex_movements'; then
            echo "::error::El rol de la aplicación pudo hacer TRUNCATE del kardex"
            exit 1
          fi

      - name: Respaldo y prueba de restauración
        run: |
          bash scripts/backup.sh
          latest="$(find backups -name 'fartmar-*.dump' -printf '%T@ %p\n' | sort -n | tail -n 1 | cut -d' ' -f2)"
          bash scripts/restore.sh "$latest"

      - name: Logs si algo falló
        if: failure()
        run: docker compose logs --no-color

      - name: Bajar el stack
        if: always()
        run: docker compose down -v

  deploy-production:
    name: Producción (aprobación manual)
    needs: deploy-staging
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' ||
       (github.event_name == 'workflow_dispatch' && inputs.confirm_production == 'DESPLEGAR'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Los revisores obligatorios se configuran en GitHub: Settings > Environments
    # > production > Required reviewers. El job queda en espera hasta que alguien
    # lo apruebe. Ver docs/DEPLOY.md.
    environment:
      name: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5

      - name: Despliegue simulado de las imágenes del commit
        run: |
          cp .env.example .env
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          bash scripts/deploy.sh production \
            "ghcr.io/${owner}/fartmar-api:${GITHUB_SHA}" \
            "ghcr.io/${owner}/fartmar-web:${GITHUB_SHA}"
