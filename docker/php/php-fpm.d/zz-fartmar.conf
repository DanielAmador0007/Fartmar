; Pool de PHP-FPM de la API. Se carga después de www.conf, docker.conf y
; zz-docker.conf (orden alfabético), así que estos valores mandan.
[global]
; Las líneas JSON de Laravel salen por el stderr de los workers; FPM las
; reenvía sin prefijo (decorate_workers_output = no). 8 KB partía las líneas
; largas (trazas de excepciones) en dos y rompía el JSON.
log_limit = 65536

[www]
listen = 9000

; El access log lo escribe Nginx en JSON (docker/nginx/default.conf); el de
; FPM duplicaría cada petición en un formato distinto.
access.log = /dev/null

; Variables de entorno del contenedor disponibles para Laravel.
clear_env = no
catch_workers_output = yes
decorate_workers_output = no

; Capacidad: cada worker atiende una petición a la vez. 10 workers con
; memory_limit de 256 MB caben en ~1 GB. Ajustar según la máquina.
pm = dynamic
pm.max_children = 10
pm.start_servers = 3
pm.min_spare_servers = 2
pm.max_spare_servers = 5
pm.max_requests = 500

; Corta peticiones colgadas (por encima de max_execution_time de PHP).
request_terminate_timeout = 150s
