; PHP de la API (producción y desarrollo). Ver docker/php/conf.d/zz-opcache-prod.ini
; para la caché de código, que solo se activa en la imagen de producción.
expose_php = Off
date.timezone = UTC
memory_limit = 256M

; Errores al log (stderr del contenedor), nunca en la respuesta HTTP.
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /proc/self/fd/2

; El asistente con un proveedor real puede tardar hasta 4 llamadas x LLM_TIMEOUT
; (S-94); Nginx corta a los 150 s (fastcgi_read_timeout).
max_execution_time = 140

; Solo JSON pequeño: no hay subida de archivos.
post_max_size = 2M
upload_max_filesize = 1M
file_uploads = Off

session.use_strict_mode = 1
