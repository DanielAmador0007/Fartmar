# Paso de una petición a Laravel (PHP-FPM). Todo entra por el front controller
# /app/public/index.php del contenedor "api": Nginx no tiene archivos PHP ni
# ejecuta ningún otro script.
fastcgi_pass $fartmar_api;

include /etc/nginx/fastcgi_params;
fastcgi_param SCRIPT_FILENAME /app/public/index.php;
fastcgi_param SCRIPT_NAME /index.php;
fastcgi_param DOCUMENT_URI /index.php;
fastcgi_param DOCUMENT_ROOT /app/public;

# httpoxy: un header "Proxy" del cliente no debe convertirse en HTTP_PROXY.
fastcgi_param HTTP_PROXY "";

# Correlation id hacia Laravel (ver map en default.conf).
fastcgi_param HTTP_X_CORRELATION_ID $fartmar_client_correlation_id;

# Nginx es el borde: REMOTE_ADDR ($remote_addr) ya es la IP del cliente. Los
# X-Forwarded-* que mande el cliente se reemplazan, para que nada aguas abajo
# pueda confiar en un valor falsificado (Laravel no confía en proxies por
# defecto: config/trustedproxy.php, S-100).
fastcgi_param HTTP_X_FORWARDED_FOR $remote_addr;
fastcgi_param HTTP_X_FORWARDED_PROTO $scheme;
fastcgi_param HTTP_X_FORWARDED_HOST "";
fastcgi_param HTTP_X_FORWARDED_PORT "";
fastcgi_param HTTP_X_FORWARDED_PREFIX "";
fastcgi_param HTTP_FORWARDED "";

fastcgi_hide_header X-Powered-By;

# El asistente con un proveedor real puede tardar (S-94).
fastcgi_read_timeout 150s;
