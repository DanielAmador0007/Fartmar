# Headers de seguridad. Se incluye a nivel de server y otra vez en cada
# location que tenga su propio add_header (Nginx no hereda add_header si la
# location define alguno).
#
# CSP: el build de Vite no tiene scripts ni estilos en línea (solo <script
# src> y <link> a /assets), así que se permite únicamente 'self'. React aplica
# los estilos dinámicos por CSSOM, que CSP no bloquea. connect-src 'self' = la
# SPA solo habla con su propia API (mismo origen, sin CORS).
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
# Equivalente a frame-ancestors 'none' para navegadores viejos.
add_header X-Frame-Options "DENY" always;
# Ninguna URL interna (ids, rutas) sale en el Referer hacia otros sitios.
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;

# HSTS SOLO cuando el sitio se sirva por HTTPS (terminación TLS en este Nginx
# o en el balanceador). Por HTTP no tiene efecto y en localhost estorba.
# Empezar con max-age corto y subirlo cuando HTTPS esté estable. Ver docs/DEPLOY.md.
# add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
