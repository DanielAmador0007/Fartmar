# Nginx del servicio "web" (frontend/Dockerfile). Se incluye dentro del bloque
# http{} de la imagen nginx-unprivileged (usuario 101, puerto 8080).
#   /            SPA de React (build estático de Vite) con fallback a index.html
#   /api/        API Laravel por FastCGI a PHP-FPM (servicio "api", puerto 9000)
#   /health      liveness de la API      /ready  readiness de la API
#   /nginx-health  liveness del propio Nginx (healthcheck del contenedor)

server_tokens off;

# Correlation id: si el cliente no manda X-Correlation-Id, se usa el id de
# Nginx ($request_id). Laravel siempre genera el suyo (S-74) y guarda este como
# client_correlation_id, así el access log de Nginx y el log de Laravel se
# cruzan por request_id <-> client_correlation_id y correlation_id.
map $http_x_correlation_id $fartmar_client_correlation_id {
    ""      $request_id;
    default $http_x_correlation_id;
}

# Ruta SIN query string para el log: los parámetros pueden traer filtros
# escritos por el usuario. La búsqueda de pacientes va por POST (S-69).
map $request_uri $fartmar_request_path {
    "~^(?<fartmar_path>[^?]*)" $fartmar_path;
    default            $request_uri;
}

# Access log en JSON, una línea por petición. Nunca cuerpos, nunca query
# string, nunca Authorization ni cookies, sin Referer (puede traer rutas de la
# SPA con ids).
log_format fartmar_json escape=json
    '{"time":"$time_iso8601",'
    '"type":"access",'
    '"request_id":"$request_id",'
    '"correlation_id":"$upstream_http_x_correlation_id",'
    '"client_correlation_id":"$fartmar_client_correlation_id",'
    '"remote_addr":"$remote_addr",'
    '"method":"$request_method",'
    '"path":"$fartmar_request_path",'
    '"status":$status,'
    '"bytes_sent":$body_bytes_sent,'
    '"request_time":$request_time,'
    '"upstream_time":"$upstream_response_time",'
    '"user_agent":"$http_user_agent"}';

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    access_log /dev/stdout fartmar_json;
    error_log /dev/stderr warn;

    # La API solo recibe JSON pequeño.
    client_max_body_size 1m;

    # DNS de Docker: re-resuelve "api" cada 10 s. Si el contenedor de la API
    # se recrea con otra IP, Nginx no queda apuntando a la vieja.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $fartmar_api api:9000;

    # Balanceador/terminador TLS delante de Nginx: descomentar con su red
    # para que $remote_addr sea el cliente real (y con él, los limitadores y
    # audit_logs de Laravel). No confiar en X-Forwarded-For de cualquiera.
    # set_real_ip_from 10.0.0.0/8;
    # real_ip_header X-Forwarded-For;
    # real_ip_recursive on;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    include /etc/nginx/fartmar/security-headers.conf;

    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location ^~ /api/ {
        include /etc/nginx/fartmar/fastcgi-api.conf;
    }

    location = /health {
        include /etc/nginx/fartmar/fastcgi-api.conf;
    }

    location = /ready {
        include /etc/nginx/fartmar/fastcgi-api.conf;
    }

    # Archivos con hash en el nombre (Vite): caché larga e inmutable.
    location ^~ /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        include /etc/nginx/fartmar/security-headers.conf;
    }

    # index.html siempre se revalida: así un despliegue nuevo se ve al recargar.
    location = /index.html {
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/fartmar/security-headers.conf;
    }

    # Rutas de la SPA (React Router): lo que no es un archivo va a index.html.
    location / {
        try_files $uri /index.html;
    }

    location ~ /\. {
        deny all;
    }
}
