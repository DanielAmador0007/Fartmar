openapi: 3.1.0
info:
  title: FARTMAR IPS — API de dispensación e inventario
  version: 0.6.1
  description: |
    API REST del sistema de dispensación, inventario por lote y traslados.

    - Autenticación: token personal de Sanctum en `Authorization: Bearer <token>` (obtenido en `POST /auth/login`).
    - Todos los errores usan el mismo formato `{ "error": { "code", "message", "details" } }`.
    - Fechas de vencimiento en `YYYY-MM-DD`; "hoy" se calcula en `America/Bogota` (S-13). Un lote que vence hoy aún se puede dispensar (S-14).
    - Ningún endpoint de dispensación expone nombre ni documento del paciente: el detalle trae solo `patient_id` y el listado ni eso (S-87). Los datos personales salen solo por `/patients/*`, enmascarados para el rol `auditor` (`masked: true`), y cada lectura queda en `patient_access_logs` (RN-10, S-68, S-75).
    - Correlación (S-74): toda respuesta trae `X-Correlation-Id` (UUID generado por el servidor; es el que queda en logs y bitácoras). Si el cliente envía su propio `X-Correlation-Id` válido (`[A-Za-z0-9-]{1,64}`), se devuelve aparte en `X-Client-Correlation-Id`.
    - Contraseña temporal (S-77): un usuario creado o restablecido por el admin tiene `must_change_password: true`; hasta cambiarla con `POST /auth/password`, todo endpoint salvo `auth/me`, `auth/password` y `auth/logout` responde 403 `CAMBIO_CLAVE_REQUERIDO`.
    - Asistente IA (`POST /assistant/query`, desde 0.6.0): consultas de inventario en lenguaje natural con herramientas de solo lectura; nunca devuelve datos de pacientes (S-89…S-96).
    - Límite de solicitudes: todos los endpoints autenticados admiten `API_RATE_LIMIT_PER_MINUTE` (120 por defecto) solicitudes por minuto por usuario; al superarlo responden 429 `DEMASIADAS_SOLICITUDES` con `Retry-After` (S-47).
servers:
  - url: http://localhost:8080/api/v1
    description: Desarrollo local (docker compose)

tags:
  - name: Autenticación
  - name: Dispensación
  - name: Inventario
  - name: Traslados
  - name: Pacientes
  - name: Usuarios
  - name: Catálogos
  - name: Asistente IA

security:
  - bearerAuth: []

paths:
  /auth/login:
    post:
      tags: [Autenticación]
      summary: Iniciar sesión y obtener un token
      security: []
      description: >-
        Limitado a 5 intentos por minuto por correo + IP y 20 por minuto por IP.
        Usuarios inactivos no pueden iniciar sesión (mismo error que clave incorrecta).
        El token vence a los `SANCTUM_EXPIRATION` minutos (480 por defecto); un usuario
        desactivado deja de autenticar aunque su token no haya vencido.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email, example: auxiliar@fartmar.test }
                password: { type: string, example: password }
                device_name: { type: string, example: spa }
      responses:
        '200':
          description: Token emitido
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: { type: string }
                  token_type: { type: string, example: Bearer }
                  expires_at: { type: string, format: date-time, nullable: true, description: 'null si la expiración está desactivada (SANCTUM_EXPIRATION=0)' }
                  user: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/InvalidCredentials' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /auth/logout:
    post:
      tags: [Autenticación]
      summary: Revocar el token actual
      responses:
        '204': { description: Token revocado }
        '401': { $ref: '#/components/responses/Unauthenticated' }

  /auth/password:
    post:
      tags: [Autenticación]
      summary: Cambiar la propia contraseña (S-77)
      description: >-
        Cualquier usuario autenticado. Exige la contraseña actual; la nueva debe tener 12+ caracteres con
        letras y números, máximo 72 bytes, ser distinta de la actual y venir confirmada. Quita
        `must_change_password`, revoca los demás tokens del usuario (conserva el de esta petición) y
        audita `user.password_changed`. Límite: 5 por minuto por usuario.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [current_password, password, password_confirmation]
              properties:
                current_password: { type: string }
                password: { type: string, minLength: 12, description: 'Máximo 72 bytes (una tilde ocupa 2)' }
                password_confirmation: { type: string }
      responses:
        '200':
          description: Contraseña cambiada
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /auth/me:
    get:
      tags: [Autenticación]
      summary: Usuario autenticado
      responses:
        '200':
          description: Usuario
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Unauthenticated' }

  /dispensations:
    get:
      tags: [Dispensación]
      summary: Listar dispensaciones (bandeja, p. ej. pendientes de autorización)
      description: |
        De la más reciente a la más antigua (`created_at`, luego `id`).
        Roles: `auxiliar_farmacia`, `regente_farmacia`, `auditor`.

        Privacidad (RN-10, S-87): cada fila es un resumen igual para todos los roles, sin ningún dato del
        paciente (ni siquiera `patient_id`, desde 0.5.1); no incluye los lotes entregados ni el motivo de rechazo.
        Por eso el listado **no** escribe en `patient_access_logs`; el detalle completo está en
        `GET /dispensations/{id}`, que sí registra el acceso.

        Cada fila trae `allowed_actions` (misma regla que el detalle), calculado sin consultas extra:
        el listado hace un número fijo de consultas (sin N+1) sin importar cuántas filas devuelva.
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [PENDIENTE_AUTORIZACION, COMPLETADA, RECHAZADA] } }
        - { name: warehouse_id, in: query, schema: { type: integer, minimum: 1 } }
        - { name: per_page, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
        - { name: page, in: query, schema: { type: integer, minimum: 1 } }
      responses:
        '200':
          description: Página de dispensaciones resumidas
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/DispensationSummary' } }
                  links: { type: object }
                  meta: { type: object }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
    post:
      tags: [Dispensación]
      summary: Crear una dispensación (idempotente)
      description: |
        Roles: `auxiliar_farmacia`, `regente_farmacia`.

        Flujo (una sola transacción, reintentada hasta 3 veces ante deadlock):
        1. Si la `Idempotency-Key` ya existe con el mismo contenido → devuelve la original (200 + `Idempotent-Replayed: true`), sin mover stock. Con otro contenido (o de otro usuario) → 409 `IDEMPOTENCIA_CONFLICTO`.
        2. Valida que la prescripción sea del paciente, esté vigente y que lo pedido no supere lo prescrito menos lo ya entregado y lo reservado por pendientes.
        3. Si algún producto es de control especial → `PENDIENTE_AUTORIZACION` sin mover stock (RN-05).
        4. Si no → asigna lotes FEFO (excluye vencidos), descuenta stock, escribe kardex `SALIDA_DISPENSACION` y queda `COMPLETADA`.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DispensationRequest' }
      responses:
        '201':
          description: Dispensación creada (COMPLETADA o PENDIENTE_AUTORIZACION)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DispensationEnvelope' }
        '200':
          description: Reintento con la misma clave y el mismo contenido; se devuelve la misma dispensación en su estado ACTUAL (p. ej. COMPLETADA si ya se autorizó), sin nueva salida de stock (S-46)
          headers:
            Idempotent-Replayed:
              schema: { type: string, enum: ['true'] }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DispensationEnvelope' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: '`STOCK_INSUFICIENTE` (con `requested` y `available`; sin detalles si lo frenó el CHECK de la BD), `IDEMPOTENCIA_CONFLICTO` o `CONFLICTO_CONCURRENCIA` (deadlock/serialización tras 3 intentos: reintentar con la misma clave)'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              examples:
                stock:
                  value:
                    error:
                      code: STOCK_INSUFICIENTE
                      message: 'No hay existencias suficientes en la bodega: se pidieron 3 unidades y solo hay 2 disponibles en lotes no vencidos.'
                      details: { warehouse_id: 1, product_id: 4, requested: 3, available: 2 }
                idempotencia:
                  value:
                    error:
                      code: IDEMPOTENCIA_CONFLICTO
                      message: Esta solicitud ya se registró antes con datos diferentes. Si es una dispensación nueva, vuelva a intentarlo desde la pantalla (se generará una clave nueva).
                      details: { idempotency_key: 6f1c... }
        '422':
          description: '`VALIDACION` (incluye falta de `Idempotency-Key`), `PRESCRIPCION_EXCEDIDA` o `PRESCRIPCION_NO_VIGENTE`'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              examples:
                excedida:
                  value:
                    error:
                      code: PRESCRIPCION_EXCEDIDA
                      message: Se pidieron 6 unidades pero a la prescripción solo le quedan 5 por entregar (prescritas 5, ya entregadas 0, pendientes de autorización 0).
                      details: { prescription_item_id: 7, requested: 6, quantity_prescribed: 5, quantity_dispensed: 0, quantity_pending_authorization: 0, remaining: 5 }
                vencida:
                  value:
                    error:
                      code: PRESCRIPCION_NO_VIGENTE
                      message: La prescripción venció el 2026-10-01; pida al médico una nueva fórmula.
                      details: { prescription_id: 3, reason: VENCIDA, valid_until: '2026-10-01' }

  /dispensations/preview:
    get:
      tags: [Dispensación]
      summary: Vista previa FEFO (no mueve stock)
      description: |
        Muestra qué lotes saldrían hoy para una cantidad, en orden FEFO y sin lotes vencidos.
        No bloquea filas: el resultado puede cambiar antes de confirmar. Para controlados es orientativa
        (los lotes se fijan al autorizar). Roles: `auxiliar_farmacia`, `regente_farmacia`.
      parameters:
        - { name: warehouse_id, in: query, required: true, schema: { type: integer } }
        - { name: product_id, in: query, required: true, schema: { type: integer } }
        - { name: quantity, in: query, required: true, schema: { type: integer, minimum: 1 } }
      responses:
        '200':
          description: Lotes asignados
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/FefoPreview' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: '`STOCK_INSUFICIENTE`'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /dispensations/{id}:
    get:
      tags: [Dispensación]
      summary: Consultar una dispensación
      description: >-
        Roles: `auxiliar_farmacia`, `regente_farmacia`, `auditor`. Registra `patient.dispensation_view` en
        `patient_access_logs` (S-75). Para el auditor, `rejection_reason` (texto libre) es `null`.
      parameters:
        - $ref: '#/components/parameters/DispensationId'
      responses:
        '200':
          description: Dispensación
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DispensationEnvelope' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /dispensations/{id}/authorize:
    post:
      tags: [Dispensación]
      summary: Autorizar un medicamento de control especial (RN-05)
      description: |
        Solo `regente_farmacia` activo **distinto** de quien creó la dispensación (`DispensationPolicy::authorize`;
        el creador recibe 403 `SEGREGACION_FUNCIONES` antes de mirar el estado). Al autorizar se asignan
        los lotes FEFO, se descuenta el stock y se escribe el kardex (usuario = regente que autoriza).
        Se revalidan vigencia de la prescripción y existencias.
      parameters:
        - $ref: '#/components/parameters/DispensationId'
      responses:
        '200':
          description: Dispensación COMPLETADA
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DispensationEnvelope' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403':
          description: '`NO_AUTORIZADO` (rol) o `SEGREGACION_FUNCIONES` (el mismo usuario que la creó)'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: '`TRANSICION_INVALIDA` (no está pendiente), `STOCK_INSUFICIENTE` o `CONFLICTO_CONCURRENCIA`'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422':
          description: '`PRESCRIPCION_NO_VIGENTE` o `PRESCRIPCION_EXCEDIDA`'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /dispensations/{id}/reject:
    post:
      tags: [Dispensación]
      summary: Rechazar un medicamento de control especial
      description: Solo `regente_farmacia` activo distinto del creador (`DispensationPolicy::reject`; el creador recibe 403 `SEGREGACION_FUNCIONES`). No mueve stock; libera la cantidad reservada.
      parameters:
        - $ref: '#/components/parameters/DispensationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, minLength: 5, maxLength: 500 }
      responses:
        '200':
          description: Dispensación RECHAZADA
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DispensationEnvelope' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403':
          description: '`NO_AUTORIZADO` o `SEGREGACION_FUNCIONES`'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: '`TRANSICION_INVALIDA`'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /stocks:
    get:
      tags: [Inventario]
      summary: Consultar existencias por bodega, producto y lote
      description: |
        Orden: bodega, producto y FEFO (vencimiento, lote). Por defecto oculta existencias en 0.
        Los lotes vencidos se muestran con `is_expired: true` (no se dispensan).
        Roles: `auxiliar_farmacia`, `regente_farmacia`, `auditor`.
      parameters:
        - { name: warehouse_id, in: query, schema: { type: integer } }
        - { name: product_id, in: query, schema: { type: integer } }
        - { name: lot_id, in: query, schema: { type: integer } }
        - { name: include_empty, in: query, schema: { type: boolean, default: false } }
        - { name: per_page, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
        - { name: page, in: query, schema: { type: integer, minimum: 1 } }
      responses:
        '200':
          description: Página de existencias
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Stock' }
                  links: { type: object }
                  meta: { type: object }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /stocks/in-transit:
    get:
      tags: [Inventario]
      summary: Stock en tránsito entre bodegas (despachado y aún no recibido)
      description: |
        Lotes despachados (`SALIDA_TRASLADO` en el origen) de traslados `EN_TRANSITO` cuya recepción aún no se registra.
        Una fila por traslado + lote (= total por origen, destino, producto y lote de ese traslado), del despacho más
        antiguo al más reciente. Lo no recibido de un traslado ya recibido no aparece aquí: es una discrepancia
        (`/transfer-discrepancies`). Origen + en tránsito + destino cuadra con el kardex.
        Roles: `auxiliar_farmacia`, `regente_farmacia`, `auditor` (solo lectura).
      parameters:
        - { name: warehouse_id, in: query, description: Bodega origen **o** destino, schema: { type: integer } }
        - { name: origin_warehouse_id, in: query, schema: { type: integer } }
        - { name: destination_warehouse_id, in: query, schema: { type: integer } }
        - { name: product_id, in: query, schema: { type: integer } }
        - { name: lot_id, in: query, schema: { type: integer } }
        - { name: per_page, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
        - { name: page, in: query, schema: { type: integer, minimum: 1 } }
      responses:
        '200':
          description: Página de stock en tránsito
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/InTransitStock' }
                  links: { type: object }
                  meta: { type: object }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /transfers:
    get:
      tags: [Traslados]
      summary: Listar traslados
      description: |
        Del más reciente al más antiguo. `warehouse_id` filtra traslados donde la bodega es origen **o** destino.
        Roles: `auxiliar_farmacia`, `regente_farmacia`, `auditor`.
      parameters:
        - { name: status, in: query, schema: { $ref: '#/components/schemas/TransferStatus' } }
        - { name: warehouse_id, in: query, schema: { type: integer } }
        - { name: per_page, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
        - { name: page, in: query, schema: { type: integer, minimum: 1 } }
      responses:
        '200':
          description: Página de traslados (sin líneas; `items_count` trae cuántos productos tiene)
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/Transfer' } }
                  links: { type: object }
                  meta: { type: object }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
    post:
      tags: [Traslados]
      summary: Crear un traslado en BORRADOR
      description: |
        No mueve stock ni reserva lotes: los lotes se eligen al despachar (FEFO). `notes` es texto libre no confiable
        (solo se valida la longitud, S-58). Roles: `auxiliar_farmacia`, `regente_farmacia`. Quien lo crea queda como solicitante (S-49).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TransferRequest' }
      responses:
        '201':
          description: Traslado creado (BORRADOR)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TransferEnvelope' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422':
          description: '`VALIDACION` (misma bodega, producto repetido, cantidad menor que 1, notas de más de 1000 caracteres) o `TRASLADO_INVALIDO`'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /transfers/{id}:
    get:
      tags: [Traslados]
      summary: Detalle de un traslado (líneas, lotes despachados/recibidos y discrepancias)
      description: 'Roles: `auxiliar_farmacia`, `regente_farmacia`, `auditor`.'
      parameters:
        - $ref: '#/components/parameters/TransferId'
      responses:
        '200':
          description: Traslado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TransferEnvelope' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /transfers/{id}/submit:
    post:
      tags: [Traslados]
      summary: Solicitar (BORRADOR → SOLICITADO)
      description: Solo quien creó el borrador (S-49).
      parameters:
        - $ref: '#/components/parameters/TransferId'
      responses:
        '200': { $ref: '#/components/responses/TransferOk' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/InvalidTransition' }

  /transfers/{id}/approve:
    post:
      tags: [Traslados]
      summary: Aprobar (SOLICITADO → APROBADO)
      description: |
        Solo `regente_farmacia` activo **distinto** de quien solicitó (RN-08). Lo niega `TransferPolicy` (con
        `SEGREGACION_FUNCIONES`, no `NO_AUTORIZADO`), lo repite el servicio y la BD lo vuelve a exigir
        (CHECK `approved_by <> requested_by` y trigger de rol). Dos aprobaciones simultáneas: una gana, la otra 409.
      parameters:
        - $ref: '#/components/parameters/TransferId'
      responses:
        '200': { $ref: '#/components/responses/TransferOk' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403':
          description: '`NO_AUTORIZADO` (rol) o `SEGREGACION_FUNCIONES` (`details.reason = MISMO_USUARIO`: quien solicitó intenta aprobar)'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/InvalidTransition' }

  /transfers/{id}/dispatch:
    post:
      tags: [Traslados]
      summary: Despachar (APROBADO → EN_TRANSITO)
      description: |
        Una transacción: bloquea el traslado, luego las existencias del ORIGEN por producto en orden FEFO
        (sin lotes vencidos, RN-01), asigna lotes (puede ser más de uno por producto), descuenta con kardex
        `SALIDA_TRASLADO` y guarda los lotes despachados. Todo o nada (S-54): si un producto no alcanza, no sale nada.
        Roles: `auxiliar_farmacia`, `regente_farmacia`.
      parameters:
        - $ref: '#/components/parameters/TransferId'
      responses:
        '200': { $ref: '#/components/responses/TransferOk' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: '`TRANSICION_INVALIDA` (no está APROBADO, p. ej. ya despachado), `STOCK_INSUFICIENTE` (con `warehouse_id`, `product_id`, `requested`, `available`) o `CONFLICTO_CONCURRENCIA`'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /transfers/{id}/receive:
    post:
      tags: [Traslados]
      summary: Recibir (EN_TRANSITO → RECIBIDO o RECIBIDO_PARCIAL)
      description: |
        Debe traer **todos** los lotes despachados con la cantidad recibida de cada uno (0..despachado, S-55).
        Lo recibido entra a la bodega DESTINO (`ENTRADA_TRASLADO`). Si falta algo → `RECIBIDO_PARCIAL` y una
        discrepancia `PENDIENTE` por cada lote con faltante. Un lote vencido en tránsito sí se recibe (S-48).
        Roles: `auxiliar_farmacia`, `regente_farmacia`.
      parameters:
        - $ref: '#/components/parameters/TransferId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [lots]
              properties:
                lots:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required: [transfer_item_lot_id, quantity_received]
                    properties:
                      transfer_item_lot_id: { type: integer, description: 'Viene en `items[].lots[].transfer_item_lot_id` del traslado' }
                      quantity_received: { type: integer, minimum: 0 }
            example:
              lots: [{ transfer_item_lot_id: 12, quantity_received: 2 }, { transfer_item_lot_id: 13, quantity_received: 1 }]
      responses:
        '200': { $ref: '#/components/responses/TransferOk' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/InvalidTransition' }
        '422':
          description: '`VALIDACION` o `TRASLADO_INVALIDO` (`details.reason`: `LOTES_NO_COINCIDEN` con `missing_transfer_item_lot_ids` y `unknown_transfer_item_lot_ids`, o `CANTIDAD_RECIBIDA_INVALIDA`)'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /transfers/{id}/cancel:
    post:
      tags: [Traslados]
      summary: Anular (desde BORRADOR, SOLICITADO o APROBADO)
      description: Quien creó el traslado o un regente (S-53). Nunca después de despachar (RN-07). No mueve stock.
      parameters:
        - $ref: '#/components/parameters/TransferId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, minLength: 5, maxLength: 500 }
      responses:
        '200': { $ref: '#/components/responses/TransferOk' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/InvalidTransition' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /transfer-discrepancies:
    get:
      tags: [Traslados]
      summary: Listar discrepancias de traslados
      description: 'Roles: `auxiliar_farmacia`, `regente_farmacia`, `auditor`.'
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [PENDIENTE, RESUELTA] } }
        - { name: transfer_id, in: query, schema: { type: integer } }
        - { name: per_page, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
        - { name: page, in: query, schema: { type: integer, minimum: 1 } }
      responses:
        '200':
          description: Página de discrepancias
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/TransferDiscrepancy' } }
                  links: { type: object }
                  meta: { type: object }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /transfer-discrepancies/{id}/resolve:
    post:
      tags: [Traslados]
      summary: Resolver una discrepancia (solo regente)
      description: |
        `REINTEGRAR_ORIGEN`: las unidades vuelven a la bodega origen con un movimiento `AJUSTE` (+) cuyo motivo cita
        la discrepancia. `PERDIDA`: solo se registra (el stock ya salió del origen). Una sola vez (S-50); una vez
        RESUELTA la BD no permite cambiarla. Quien **recibió** el traslado no puede resolver su discrepancia (S-60;
        también lo exige un trigger en BD).
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action, resolution]
              properties:
                action: { type: string, enum: [REINTEGRAR_ORIGEN, PERDIDA] }
                resolution: { type: string, minLength: 5, maxLength: 1000 }
      responses:
        '200':
          description: Discrepancia RESUELTA
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/TransferDiscrepancy' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403':
          description: '`NO_AUTORIZADO` (rol) o `SEGREGACION_FUNCIONES` (`details.reason = ES_RECEPTOR`: quien recibió el traslado intenta resolver)'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: '`TRANSICION_INVALIDA` (ya estaba resuelta)'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /inventory-adjustments:
    post:
      tags: [Inventario]
      summary: Ajuste manual de inventario (movimiento AJUSTE)
      description: |
        Solo `regente_farmacia`. `quantity` con signo: positivo suma, negativo resta (nunca 0). Motivo obligatorio
        (también CHECK en BD). Un ajuste negativo puede dar de baja un lote vencido (S-35); nunca deja stock negativo.
        La respuesta es el movimiento de kardex creado (S-56).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [warehouse_id, lot_id, quantity, reason]
              properties:
                warehouse_id: { type: integer }
                lot_id: { type: integer }
                quantity: { type: integer, minimum: -100000, maximum: 100000, not: { const: 0 } }
                reason: { type: string, minLength: 5, maxLength: 500 }
            example: { warehouse_id: 1, lot_id: 7, quantity: -3, reason: Baja por vencimiento }
      responses:
        '201':
          description: Movimiento AJUSTE registrado
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/KardexMovement' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: '`STOCK_INSUFICIENTE` (el ajuste negativo supera la existencia)'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422':
          description: '`VALIDACION` (sin motivo, cantidad 0) o `AJUSTE_INVALIDO`'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /kardex:
    get:
      tags: [Inventario]
      summary: Consultar el kardex (movimientos inmutables con saldo)
      description: |
        Del más reciente al más antiguo. `from` y `to` son días completos en hora de Bogotá (S-57).
        Roles: `auxiliar_farmacia`, `regente_farmacia`, `auditor`.
      parameters:
        - { name: warehouse_id, in: query, schema: { type: integer } }
        - { name: product_id, in: query, schema: { type: integer } }
        - { name: lot_id, in: query, schema: { type: integer } }
        - { name: type, in: query, schema: { type: string, enum: [ENTRADA, SALIDA_DISPENSACION, SALIDA_TRASLADO, ENTRADA_TRASLADO, AJUSTE] } }
        - name: reference_type
          in: query
          description: |
            Documento que originó el movimiento. `transfer` trae `SALIDA_TRASLADO`/`ENTRADA_TRASLADO`; `transfer_discrepancy`
            el `AJUSTE` de reintegro; `dispensation` las `SALIDA_DISPENSACION`. Obligatorio si se envía `reference_id`.
          schema: { type: string, enum: [dispensation, transfer, transfer_discrepancy] }
        - { name: reference_id, in: query, description: 'Id del documento (requiere `reference_type`)', schema: { type: integer, minimum: 1 } }
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
        - { name: per_page, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
        - { name: page, in: query, schema: { type: integer, minimum: 1 } }
      responses:
        '200':
          description: Página de movimientos
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/KardexMovement' } }
                  links: { type: object }
                  meta: { type: object }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /alerts:
    get:
      tags: [Inventario]
      summary: Alertas de vencimiento y stock mínimo (RN-11)
      description: |
        `expiring_lots`: existencias con unidades que vencen en `ALERT_EXPIRY_DAYS` días o menos (90 por defecto),
        incluidas las ya vencidas (`is_expired: true`). `low_stock`: productos con mínimo definido cuyo disponible en
        lotes no vencidos es menor que el mínimo (incluye disponible 0). Ver S-51.
        Cada lista trae como máximo `limit` filas (las más urgentes primero); `expiring_lots_total` y `low_stock_total`
        dicen cuántas hay en total. Si el total supera el límite, filtrar por bodega (S-62).
        Roles: `auxiliar_farmacia`, `regente_farmacia`, `auditor`.
      parameters:
        - { name: warehouse_id, in: query, schema: { type: integer } }
        - { name: limit, in: query, description: Máximo de filas por lista, schema: { type: integer, minimum: 1, maximum: 500, default: 100 } }
      responses:
        '200':
          description: Alertas
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Alerts' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /patients/search:
    post:
      tags: [Pacientes]
      summary: Buscar un paciente por documento (exacta, S-69)
      description: >-
        Roles: `auxiliar_farmacia`, `regente_farmacia`, `medico`, `auditor` (enmascarado). Búsqueda exacta por
        HMAC del documento (acepta puntos, guiones y espacios); va por POST para que el documento no quede en
        URLs ni logs de acceso. Encontrado → `patient.search` en `patient_access_logs`; sin resultado →
        `patient.search_not_found` en `audit_logs` (sin el número). Límite: 30 por minuto por usuario.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [document_type, document_number]
              properties:
                document_type: { type: string, enum: [CC, TI, CE, RC, PA] }
                document_number: { type: string, minLength: 3, maxLength: 30, pattern: '^[0-9A-Za-z .-]+$', example: 1.032.456.789 }
      responses:
        '200':
          description: 'Cero o un paciente'
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    maxItems: 1
                    items: { $ref: '#/components/schemas/Patient' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /patients/{id}:
    get:
      tags: [Pacientes]
      summary: Consultar un paciente
      description: >-
        Mismos roles que la búsqueda; admin no. Registra `patient.view` (con `masked`). Un 403 o 404 no se registra.
      parameters:
        - $ref: '#/components/parameters/PatientId'
      responses:
        '200':
          description: Paciente
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Patient' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /patients/{id}/prescriptions:
    get:
      tags: [Pacientes]
      summary: Prescripciones del paciente con cantidades pendientes
      description: >-
        Mismos roles que la búsqueda. Las 50 más recientes. Registra `patient.prescriptions`. Para el auditor,
        `instructions` (texto libre) es `null`.
      parameters:
        - $ref: '#/components/parameters/PatientId'
      responses:
        '200':
          description: Prescripciones
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Prescription' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /prescriptions:
    post:
      tags: [Pacientes]
      summary: Crear una prescripción (solo médico, S-70)
      description: >-
        Nace `ACTIVA` con número `RX-` + ULID. `valid_until` posterior a hoy (Bogotá) y como máximo hoy + 365.
        Audita `prescription.created` (sin las indicaciones).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [patient_id, valid_until, items]
              properties:
                patient_id: { type: integer }
                valid_until: { type: string, format: date }
                items:
                  type: array
                  minItems: 1
                  maxItems: 20
                  items:
                    type: object
                    required: [product_id, quantity]
                    additionalProperties: false
                    properties:
                      product_id: { type: integer, description: 'Sin repetir en la prescripción' }
                      quantity: { type: integer, minimum: 1, maximum: 10000 }
                      instructions: { type: string, maxLength: 255, nullable: true }
      responses:
        '201':
          description: Prescripción creada
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Prescription' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /assistant/query:
    post:
      tags: [Asistente IA]
      summary: Preguntar al asistente de inventario en lenguaje natural
      description: |
        El modelo (proveedor según `LLM_PROVIDER`: `mock` por defecto, `ollama` o `anthropic`) solo puede pedir
        herramientas de **solo lectura** de una lista blanca: `search_products`, `list_warehouses`, `get_stock`,
        `get_expiring_lots` (`days` 1–365), `get_expired_lots`, `get_below_minimum`, `get_transfers`. El servidor valida
        los argumentos y autoriza cada herramienta con las Policies del usuario. No hay SQL libre ni escritura.

        - Preguntas sobre pacientes, prescripciones o dispensaciones, pedidos de SQL, de modificar datos o de cambiar las
          instrucciones se rechazan **sin llamar al modelo** (`outcome: refused`, 200).
        - Fuera de alcance → `outcome: out_of_scope` con la respuesta estándar: "Solo puedo responder consultas de
          inventario, lotes, vencimientos, stock mínimo y traslados. No encontré información para eso."
        - Si la respuesta del modelo trae datos fuera de alcance (documentos, `SYSTEM:`, el system prompt), el servidor la
          reemplaza (`outcome: refused`, `result: null`).
        - `answer` es **texto plano** con saltos de línea; mostrarlo como texto, nunca como HTML. Las observaciones de
          traslados en `result.rows[].notes` vienen como `{untrusted: true, text}`; ese texto nunca se envía al modelo (solo sabe si existe).

        Roles: `auxiliar_farmacia`, `regente_farmacia`, `auditor` (Gate `useAssistant` = puede leer inventario, S-89).
        Límite propio: `ASSISTANT_RATE_LIMIT_PER_MINUTE` (10) preguntas por minuto por usuario, además del general.
        Puede tardar varios segundos con un proveedor real (hasta 4 llamadas al modelo de `LLM_TIMEOUT` s cada una).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AssistantQueryRequest' }
            example: { question: '¿Qué lotes de acetaminofén vencen en los próximos 60 días en la farmacia central?' }
      responses:
        '200':
          description: Respuesta del asistente (también para rechazos y fuera de alcance; ver `outcome`)
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/AssistantAnswer' }
              example:
                data:
                  answer: "Lotes de Acetaminofén 500 mg que vencen en los próximos 60 días en Farmacia Central:\n- L-ACE-2402 (Acetaminofén 500 mg) en Farmacia Central: 50 unidades, vence el 2026-11-01 (en 20 días)."
                  outcome: answered
                  provider: mock
                  tools_used:
                    - { name: search_products, arguments: { query: acetaminofen }, ok: true }
                    - { name: get_expiring_lots, arguments: { days: 60, warehouse_code: FAR-CEN, product_id: 1 }, ok: true }
                  result:
                    tool: get_expiring_lots
                    filters:
                      days: 60
                      product: { id: 1, code: ACE500, name: Acetaminofén 500 mg }
                      warehouse: { code: FAR-CEN, name: Farmacia Central }
                    count: 1
                    truncated: false
                    rows:
                      - warehouse: { code: FAR-CEN, name: Farmacia Central }
                        product: { id: 1, code: ACE500, name: Acetaminofén 500 mg }
                        lot_number: L-ACE-2402
                        expires_at: '2026-11-01'
                        days_to_expire: 20
                        quantity: 50
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503':
          description: '`ASISTENTE_NO_DISPONIBLE`: el proveedor del modelo no respondió, falló o no está configurado. `details` vacío: sin detalles técnicos ni nombre del proveedor (queda en el log).'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /warehouses:
    get:
      tags: [Catálogos]
      summary: Listar bodegas
      description: |
        Todas las bodegas, ordenadas por código (el modelo no tiene marca de activa/inactiva, S-86).
        Roles: todos (usuario activo).
      parameters:
        - { name: per_page, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 100 } }
        - { name: page, in: query, schema: { type: integer, minimum: 1 } }
      responses:
        '200':
          description: Página de bodegas
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/WarehouseSummary' } }
                  links: { type: object }
                  meta: { type: object }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /products:
    get:
      tags: [Catálogos]
      summary: Listar productos (con búsqueda)
      description: |
        Ordenados por nombre. `q` busca sin distinguir mayúsculas dentro del nombre **o** del código;
        `%` y `_` se buscan como texto literal (S-86). `q` vacío o con solo espacios = sin filtro.
        Roles: todos (usuario activo); el médico lo usa para prescribir.
      parameters:
        - { name: q, in: query, schema: { type: string, maxLength: 100 }, example: acetamin }
        - { name: per_page, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
        - { name: page, in: query, schema: { type: integer, minimum: 1 } }
      responses:
        '200':
          description: Página de productos
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/Product' } }
                  links: { type: object }
                  meta: { type: object }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /users:
    get:
      tags: [Usuarios]
      summary: Listar usuarios (solo admin)
      parameters:
        - { name: page, in: query, schema: { type: integer, minimum: 1 } }
      responses:
        '200':
          description: Página de 50 usuarios (ordenados por nombre)
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/User' }
                  links: { type: object }
                  meta: { type: object }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Usuarios]
      summary: Crear un usuario (solo admin, S-72 y S-77)
      description: >-
        El correo se guarda en minúsculas y debe ser único. La contraseña es TEMPORAL: el usuario nace con
        `must_change_password: true`. Audita `user.created` con el rol.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, password, role]
              properties:
                name: { type: string, minLength: 3, maxLength: 120 }
                email: { type: string, format: email }
                password: { type: string, minLength: 12, description: 'Letras y números; máximo 72 bytes' }
                role: { type: string, enum: [auxiliar_farmacia, regente_farmacia, medico, auditor, admin] }
      responses:
        '201':
          description: Usuario creado
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /users/{id}:
    patch:
      tags: [Usuarios]
      summary: Cambiar nombre, rol, estado o restablecer la contraseña (solo admin)
      description: >-
        Al menos un campo. Desactivar, cambiar el rol o restablecer la contraseña revoca todos los tokens del
        usuario; una contraseña restablecida es temporal (`must_change_password: true`, auditada como
        `user.password_reset`). Un admin no puede desactivarse ni quitarse el rol admin a sí mismo
        (422 `OPERACION_NO_PERMITIDA`). El correo no se cambia. Sin DELETE: se desactiva.
      parameters:
        - $ref: '#/components/parameters/UserId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                name: { type: string, minLength: 3, maxLength: 120 }
                role: { type: string, enum: [auxiliar_farmacia, regente_farmacia, medico, auditor, admin] }
                is_active: { type: boolean }
                password: { type: string, minLength: 12, description: 'Contraseña temporal nueva; máximo 72 bytes' }
      responses:
        '200':
          description: Usuario actualizado
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422':
          description: '`VALIDACION` u `OPERACION_NO_PERMITIDA` (`details.reason = AUTOBLOQUEO`)'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer

  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Clave generada por el cliente para cada intento lógico de dispensación (se recomienda un UUID). 8–100 caracteres `[A-Za-z0-9_-]`. Reutilícela solo al reintentar la MISMA solicitud.
      schema: { type: string, minLength: 8, maxLength: 100, pattern: '^[A-Za-z0-9_-]+$', example: 3f2b8c1e-8d4a-4f7e-9a51-0c6b2d9e7a10 }
    DispensationId:
      name: id
      in: path
      required: true
      schema: { type: integer }
    TransferId:
      name: id
      in: path
      required: true
      schema: { type: integer }
    PatientId:
      name: id
      in: path
      required: true
      schema: { type: integer }
    UserId:
      name: id
      in: path
      required: true
      schema: { type: integer }
    ClientCorrelationId:
      name: X-Correlation-Id
      in: header
      required: false
      description: 'Id propio del cliente (opcional, `[A-Za-z0-9-]{1,64}`). No reemplaza al del servidor: se devuelve en `X-Client-Correlation-Id` y se registra como `client_correlation_id` en los logs (S-74).'
      schema: { type: string, maxLength: 64, pattern: '^[A-Za-z0-9-]+$' }

  headers:
    X-Correlation-Id:
      description: UUID generado por el servidor para esta petición; es el que queda en logs, `audit_logs`, kardex, dispensaciones y `patient_access_logs`. Viene en TODAS las respuestas de `/api/*`.
      schema: { type: string, format: uuid }
    X-Client-Correlation-Id:
      description: Eco del `X-Correlation-Id` enviado por el cliente, si era válido.
      schema: { type: string }

  responses:
    Unauthenticated:
      description: '`NO_AUTENTICADO`'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    InvalidCredentials:
      description: '`CREDENCIALES_INVALIDAS`'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: '`NO_AUTORIZADO`: el rol no tiene permiso; o `CAMBIO_CLAVE_REQUERIDO`: el usuario tiene una contraseña temporal y debe cambiarla (S-77)'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: '`NO_ENCONTRADO`'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    ValidationError:
      description: '`VALIDACION`: `details.fields` trae los errores por campo'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    TooManyRequests:
      description: '`DEMASIADAS_SOLICITUDES`'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    InvalidTransition:
      description: '`TRANSICION_INVALIDA`: el traslado no está en el estado que permite esta acción (`details.from`, `details.to`); o `CONFLICTO_CONCURRENCIA`'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    TransferOk:
      description: Traslado en su nuevo estado
      content:
        application/json:
          schema: { $ref: '#/components/schemas/TransferEnvelope' }

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, details]
          properties:
            code:
              type: string
              enum:
                - STOCK_INSUFICIENTE
                - LOTE_VENCIDO
                - PRESCRIPCION_EXCEDIDA
                - PRESCRIPCION_NO_VIGENTE
                - TRANSICION_INVALIDA
                - SEGREGACION_FUNCIONES
                - IDEMPOTENCIA_CONFLICTO
                - CREDENCIALES_INVALIDAS
                - VALIDACION
                - NO_AUTENTICADO
                - NO_AUTORIZADO
                - NO_ENCONTRADO
                - DEMASIADAS_SOLICITUDES
                - CONFLICTO_CONCURRENCIA
                - TRASLADO_INVALIDO
                - AJUSTE_INVALIDO
                - OPERACION_NO_PERMITIDA
                - CAMBIO_CLAVE_REQUERIDO
                - ASISTENTE_NO_DISPONIBLE
                - ERROR_INTERNO
            message: { type: string, description: Mensaje en español para el usuario final }
            details: { type: object, additionalProperties: true }

    User:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        email: { type: string }
        role: { type: string, enum: [auxiliar_farmacia, regente_farmacia, medico, auditor, admin] }
        is_active: { type: boolean }
        must_change_password: { type: boolean, description: 'true = contraseña temporal; el frontend debe llevar a cambiarla (S-77)' }

    Patient:
      type: object
      description: >-
        Mismas claves para todos los roles. Con `masked: true` (auditor): documento `******` + últimos 4,
        nombres con la inicial de cada palabra (`J*** P***`), `birth_date` y `phone` en `null` (S-68).
      properties:
        id: { type: integer }
        document_type: { type: string, enum: [CC, TI, CE, RC, PA] }
        document_number: { type: string, example: '******6789' }
        first_name: { type: string, example: 'J***' }
        last_name: { type: string, example: 'P***' }
        birth_date: { type: string, format: date, nullable: true }
        phone: { type: string, nullable: true }
        masked: { type: boolean }

    PrescriptionItem:
      type: object
      properties:
        id: { type: integer, description: 'prescription_item_id para POST /dispensations' }
        product:
          type: object
          properties:
            id: { type: integer }
            code: { type: string }
            name: { type: string }
            is_controlled: { type: boolean }
        quantity_prescribed: { type: integer }
        quantity_dispensed: { type: integer }
        quantity_reserved: { type: integer, description: 'En dispensaciones PENDIENTE_AUTORIZACION (S-31)' }
        quantity_available: { type: integer, description: 'prescrito - entregado - reservado' }
        instructions: { type: string, nullable: true, description: 'null para el auditor (texto libre)' }

    Prescription:
      type: object
      properties:
        id: { type: integer }
        number: { type: string, example: RX-01JA2B3C4D5E6F7G8H9J0K1M2N }
        patient_id: { type: integer }
        status: { type: string, enum: [ACTIVA, COMPLETADA, ANULADA] }
        is_current: { type: boolean, description: 'ACTIVA y valid_until >= hoy (Bogotá), S-21' }
        issued_at: { type: string, format: date-time }
        valid_until: { type: string, format: date }
        prescriber: { $ref: '#/components/schemas/UserSummary' }
        items:
          type: array
          items: { $ref: '#/components/schemas/PrescriptionItem' }

    UserSummary:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        role: { type: string }

    DispensationRequest:
      type: object
      required: [patient_id, prescription_id, warehouse_id, items]
      properties:
        patient_id: { type: integer }
        prescription_id: { type: integer }
        warehouse_id: { type: integer }
        items:
          type: array
          minItems: 1
          maxItems: 20
          items:
            type: object
            required: [prescription_item_id, quantity]
            properties:
              prescription_item_id: { type: integer, description: Línea de la prescripción (no repetir) }
              quantity: { type: integer, minimum: 1 }
      example:
        patient_id: 1
        prescription_id: 1
        warehouse_id: 1
        items: [{ prescription_item_id: 1, quantity: 10 }]

    DispensationEnvelope:
      type: object
      properties:
        data: { $ref: '#/components/schemas/Dispensation' }

    Dispensation:
      type: object
      properties:
        id: { type: integer }
        status: { type: string, enum: [PENDIENTE_AUTORIZACION, COMPLETADA, RECHAZADA] }
        requires_authorization: { type: boolean }
        patient_id: { type: integer, description: Solo el ID; los datos del paciente se consultan aparte (enmascarados según rol) }
        prescription:
          type: object
          properties:
            id: { type: integer }
            number: { type: string }
        warehouse:
          type: object
          properties:
            id: { type: integer }
            code: { type: string }
            name: { type: string }
        items:
          type: array
          items:
            type: object
            properties:
              id: { type: integer }
              prescription_item_id: { type: integer }
              product:
                type: object
                properties:
                  id: { type: integer }
                  code: { type: string }
                  name: { type: string }
                  is_controlled: { type: boolean }
              quantity: { type: integer }
              lots:
                type: array
                description: Lotes FEFO de los que salió (vacío mientras está pendiente de autorización)
                items: { $ref: '#/components/schemas/LotAllocation' }
        created_by: { $ref: '#/components/schemas/UserSummary' }
        authorized_by:
          oneOf: [{ $ref: '#/components/schemas/UserSummary' }, { type: 'null' }]
        authorized_at: { type: [string, 'null'], format: date-time }
        rejected_by:
          oneOf: [{ $ref: '#/components/schemas/UserSummary' }, { type: 'null' }]
        rejected_at: { type: [string, 'null'], format: date-time }
        rejection_reason: { type: [string, 'null'] }
        created_at: { type: string, format: date-time }
        allowed_actions:
          type: array
          description: |
            Acciones que el usuario autenticado puede ejecutar ahora: solo si la dispensación está
            `PENDIENTE_AUTORIZACION` **y** `DispensationPolicy` lo permite (regente activo distinto del creador, RN-05).
            En cualquier otro caso es `[]`. Solo informa qué botones mostrar; cada endpoint vuelve a autorizar y validar.
          items: { type: string, enum: [authorize, reject] }
          example: [authorize, reject]

    LotAllocation:
      type: object
      properties:
        lot_id: { type: integer }
        lot_number: { type: string }
        expires_at: { type: string, format: date }
        quantity: { type: integer }

    FefoPreview:
      type: object
      properties:
        warehouse_id: { type: integer }
        product:
          type: object
          properties:
            id: { type: integer }
            code: { type: string }
            name: { type: string }
            is_controlled: { type: boolean }
        quantity: { type: integer }
        requires_authorization: { type: boolean }
        lots:
          type: array
          items: { $ref: '#/components/schemas/LotAllocation' }

    Stock:
      type: object
      properties:
        id: { type: integer }
        warehouse:
          type: object
          properties:
            id: { type: integer }
            code: { type: string }
            name: { type: string }
        product:
          type: object
          properties:
            id: { type: integer }
            code: { type: string }
            name: { type: string }
            is_controlled: { type: boolean }
        lot:
          type: object
          properties:
            id: { type: integer }
            lot_number: { type: string }
            expires_at: { type: string, format: date }
            is_expired: { type: boolean }
        quantity: { type: integer }

    TransferStatus:
      type: string
      enum: [BORRADOR, SOLICITADO, APROBADO, EN_TRANSITO, RECIBIDO, RECIBIDO_PARCIAL, ANULADO]

    WarehouseSummary:
      type: object
      properties:
        id: { type: integer }
        code: { type: string }
        name: { type: string }

    ProductSummary:
      type: object
      properties:
        id: { type: integer }
        code: { type: string }
        name: { type: string }

    Product:
      type: object
      properties:
        id: { type: integer }
        code: { type: string, example: MED-001 }
        name: { type: string, example: Acetaminofén 500 mg }
        presentation: { type: string, example: Tableta 500 mg }
        unit: { type: string, example: tableta }
        is_controlled: { type: boolean, description: 'Control especial: requiere autorización de un segundo regente (RN-05)' }
        stock_minimums:
          type: array
          description: Mínimo de stock por bodega (RN-11); vacío si no hay mínimos definidos
          items:
            type: object
            properties:
              warehouse_id: { type: integer }
              min_quantity: { type: integer }

    DispensationSummary:
      type: object
      description: Fila del listado de dispensaciones. Sin ningún dato del paciente (ni su ID), sin lotes y sin motivo de rechazo (S-87).
      properties:
        id: { type: integer }
        status: { type: string, enum: [PENDIENTE_AUTORIZACION, COMPLETADA, RECHAZADA] }
        requires_authorization: { type: boolean }
        prescription:
          type: object
          properties:
            id: { type: integer }
            number: { type: string }
        warehouse: { $ref: '#/components/schemas/WarehouseSummary' }
        items:
          type: array
          items:
            type: object
            properties:
              id: { type: integer }
              product:
                type: object
                properties:
                  id: { type: integer }
                  code: { type: string }
                  name: { type: string }
                  is_controlled: { type: boolean }
              quantity: { type: integer }
        created_by: { $ref: '#/components/schemas/UserSummary' }
        authorized_by: { oneOf: [{ $ref: '#/components/schemas/UserSummary' }, { type: 'null' }] }
        authorized_at: { type: [string, 'null'], format: date-time }
        rejected_by: { oneOf: [{ $ref: '#/components/schemas/UserSummary' }, { type: 'null' }] }
        rejected_at: { type: [string, 'null'], format: date-time }
        created_at: { type: string, format: date-time }
        allowed_actions:
          type: array
          description: |
            Acciones que el usuario autenticado puede ejecutar ahora: solo si la dispensación está
            `PENDIENTE_AUTORIZACION` **y** `DispensationPolicy` lo permite (regente activo distinto del creador, RN-05).
            En cualquier otro caso es `[]`. Solo informa qué botones mostrar; cada endpoint vuelve a autorizar y validar.
          items: { type: string, enum: [authorize, reject] }
          example: [authorize, reject]

    LotSummary:
      type: object
      properties:
        id: { type: integer }
        lot_number: { type: string }
        expires_at: { type: string, format: date }

    InTransitStock:
      type: object
      properties:
        transfer_id: { type: integer }
        transfer_item_lot_id: { type: integer }
        dispatched_at: { type: string, format: date-time }
        origin_warehouse: { $ref: '#/components/schemas/WarehouseSummary' }
        destination_warehouse: { $ref: '#/components/schemas/WarehouseSummary' }
        product: { $ref: '#/components/schemas/ProductSummary' }
        lot:
          type: object
          properties:
            id: { type: integer }
            lot_number: { type: string }
            expires_at: { type: string, format: date }
            is_expired: { type: boolean, description: 'Puede vencer en el camino; igual se recibe (S-48)' }
        quantity: { type: integer, minimum: 1, description: Unidades despachadas de ese lote que van en camino }

    TransferRequest:
      type: object
      required: [origin_warehouse_id, destination_warehouse_id, items]
      properties:
        origin_warehouse_id: { type: integer }
        destination_warehouse_id: { type: integer, description: Distinta del origen }
        notes: { type: [string, 'null'], maxLength: 1000, description: Texto libre no confiable (S-58) }
        items:
          type: array
          minItems: 1
          maxItems: 50
          items:
            type: object
            required: [product_id, quantity]
            properties:
              product_id: { type: integer, description: Sin repetir }
              quantity: { type: integer, minimum: 1 }
      example:
        origin_warehouse_id: 1
        destination_warehouse_id: 2
        notes: Reposición semanal
        items: [{ product_id: 3, quantity: 20 }]

    TransferEnvelope:
      type: object
      properties:
        data: { $ref: '#/components/schemas/Transfer' }

    Transfer:
      type: object
      properties:
        id: { type: integer }
        status: { $ref: '#/components/schemas/TransferStatus' }
        origin_warehouse: { $ref: '#/components/schemas/WarehouseSummary' }
        destination_warehouse: { $ref: '#/components/schemas/WarehouseSummary' }
        notes: { type: [string, 'null'] }
        items_count: { type: integer, description: Solo en el listado }
        items:
          type: array
          description: Solo en el detalle y en las respuestas de las acciones
          items:
            type: object
            properties:
              id: { type: integer }
              product: { $ref: '#/components/schemas/ProductSummary' }
              quantity_requested: { type: integer }
              lots:
                type: array
                description: Lotes despachados (vacío hasta despachar)
                items:
                  type: object
                  properties:
                    transfer_item_lot_id: { type: integer }
                    lot_id: { type: integer }
                    lot_number: { type: string }
                    expires_at: { type: string, format: date }
                    quantity_dispatched: { type: integer }
                    quantity_received: { type: [integer, 'null'], description: null mientras está en tránsito }
                    discrepancy:
                      oneOf:
                        - type: 'null'
                        - type: object
                          properties:
                            id: { type: integer }
                            status: { type: string, enum: [PENDIENTE, RESUELTA] }
                            quantity_missing: { type: integer }
                            resolution_action: { type: [string, 'null'], enum: [REINTEGRAR_ORIGEN, PERDIDA, null] }
        requested_by: { $ref: '#/components/schemas/UserSummary' }
        requested_at: { type: [string, 'null'], format: date-time }
        approved_by: { oneOf: [{ $ref: '#/components/schemas/UserSummary' }, { type: 'null' }] }
        approved_at: { type: [string, 'null'], format: date-time }
        dispatched_by: { oneOf: [{ $ref: '#/components/schemas/UserSummary' }, { type: 'null' }] }
        dispatched_at: { type: [string, 'null'], format: date-time }
        received_by: { oneOf: [{ $ref: '#/components/schemas/UserSummary' }, { type: 'null' }] }
        received_at: { type: [string, 'null'], format: date-time }
        cancelled_by: { oneOf: [{ $ref: '#/components/schemas/UserSummary' }, { type: 'null' }] }
        cancelled_at: { type: [string, 'null'], format: date-time }
        cancellation_reason: { type: [string, 'null'] }
        created_at: { type: string, format: date-time }
        allowed_actions:
          type: array
          description: |
            Acciones que el usuario autenticado puede ejecutar ahora sobre el traslado: transición válida desde el estado
            actual **y** permitida por `TransferPolicy` (p. ej. el regente que solicitó no recibe `approve`). Solo informa
            qué botones mostrar; cada endpoint vuelve a autorizar y validar.
          items: { type: string, enum: [submit, approve, dispatch, receive, cancel] }
          example: [approve, cancel]

    TransferDiscrepancy:
      type: object
      properties:
        id: { type: integer }
        status: { type: string, enum: [PENDIENTE, RESUELTA] }
        transfer_id: { type: integer }
        transfer_status: { $ref: '#/components/schemas/TransferStatus' }
        origin_warehouse_id: { type: integer }
        destination_warehouse_id: { type: integer }
        transfer_item_lot_id: { type: integer }
        product: { $ref: '#/components/schemas/ProductSummary' }
        lot: { $ref: '#/components/schemas/LotSummary' }
        quantity_dispatched: { type: integer }
        quantity_received: { type: integer }
        quantity_missing: { type: integer }
        resolution_action: { type: [string, 'null'], enum: [REINTEGRAR_ORIGEN, PERDIDA, null] }
        resolution: { type: [string, 'null'] }
        resolved_by: { oneOf: [{ $ref: '#/components/schemas/UserSummary' }, { type: 'null' }] }
        resolved_at: { type: [string, 'null'], format: date-time }
        created_at: { type: string, format: date-time }

    KardexMovement:
      type: object
      properties:
        id: { type: integer }
        created_at: { type: string, format: date-time }
        type: { type: string, enum: [ENTRADA, SALIDA_DISPENSACION, SALIDA_TRASLADO, ENTRADA_TRASLADO, AJUSTE] }
        direction: { type: integer, enum: [-1, 1] }
        quantity: { type: integer, minimum: 1 }
        signed_quantity: { type: integer, description: quantity × direction }
        balance_after: { type: integer, minimum: 0, description: Saldo del lote en la bodega después del movimiento }
        warehouse: { $ref: '#/components/schemas/WarehouseSummary' }
        product: { $ref: '#/components/schemas/ProductSummary' }
        lot: { $ref: '#/components/schemas/LotSummary' }
        reason: { type: [string, 'null'], description: Obligatorio en AJUSTE }
        reference:
          oneOf:
            - type: 'null'
            - type: object
              properties:
                type: { type: string, enum: [dispensation, transfer, transfer_discrepancy] }
                id: { type: integer }
        user: { $ref: '#/components/schemas/UserSummary' }

    Alerts:
      type: object
      properties:
        today: { type: string, format: date, description: Hoy en America/Bogota }
        expiry_days: { type: integer, example: 90 }
        limit: { type: integer, description: Máximo de filas por lista aplicado, example: 100 }
        expiring_lots_total: { type: integer, description: Total de existencias por vencer (aunque la lista esté recortada) }
        low_stock_total: { type: integer, description: Total de productos bajo mínimo (aunque la lista esté recortada) }
        expiring_lots:
          type: array
          items:
            type: object
            properties:
              stock_id: { type: integer }
              warehouse: { $ref: '#/components/schemas/WarehouseSummary' }
              product: { $ref: '#/components/schemas/ProductSummary' }
              lot: { $ref: '#/components/schemas/LotSummary' }
              quantity: { type: integer }
              days_to_expire: { type: integer, description: 0 = vence hoy; negativo = vencido }
              is_expired: { type: boolean }
        low_stock:
          type: array
          items:
            type: object
            properties:
              warehouse: { $ref: '#/components/schemas/WarehouseSummary' }
              product: { $ref: '#/components/schemas/ProductSummary' }
              min_quantity: { type: integer }
              available: { type: integer, description: Unidades en lotes no vencidos }
              shortfall: { type: integer }

    AssistantQueryRequest:
      type: object
      required: [question]
      properties:
        question: { type: string, minLength: 3, maxLength: 500 }

    AssistantAnswer:
      type: object
      required: [answer, outcome, provider, tools_used, result]
      properties:
        answer: { type: string, description: Texto plano para mostrar (puede traer saltos de línea) }
        outcome:
          type: string
          enum: [answered, refused, out_of_scope]
          description: '`answered`: respondió con herramientas (con o sin filas); `refused`: rechazo del servidor o respuesta bloqueada por el filtro de salida; `out_of_scope`: respuesta estándar de fuera de alcance'
        provider: { type: string, enum: [mock, ollama, anthropic] }
        tools_used:
          type: array
          description: Herramientas que pidió el modelo, en orden, y si se ejecutaron. `arguments` son los argumentos validados y normalizados con que se ejecutó (textos recortados a 100 caracteres); `{}` si la herramienta fue rechazada (OpenAPI 0.6.1)
          items:
            type: object
            properties:
              name: { type: string }
              arguments: { type: object, additionalProperties: true }
              ok: { type: boolean, description: false = rechazada (herramienta desconocida, sin permiso o argumentos inválidos) }
        result:
          description: |
            Datos de la última herramienta de consulta ejecutada con éxito (no cuenta `search_products`), para pintar una
            tabla; `null` si no hubo o si la respuesta fue bloqueada. Forma común: `{tool, filters, count, truncated, rows}`.
            Filas por herramienta:
            - `get_stock`: `{warehouse{code,name}, product{id,code,name}, lot_number, expires_at, is_expired, quantity}`;
              además `total_quantity` y `available_quantity` (sin vencidos) de las filas devueltas.
            - `get_expiring_lots` / `get_expired_lots`: `{warehouse, product, lot_number, expires_at, days_to_expire, quantity}`.
            - `get_below_minimum`: `{warehouse, product, min_quantity, available, shortfall}`.
            - `get_transfers`: `{id, status, origin, destination, items[{product, quantity_requested}], requested_at,
              dispatched_at, received_at, notes: {untrusted: true, text} | null}`.
            - `list_warehouses`: `{code, name}` (sin `truncated`).
            Máximo 50 filas (20 traslados); `truncated: true` si hay más.
          oneOf:
            - type: 'null'
            - type: object
              required: [tool, rows]
              properties:
                tool: { type: string, enum: [list_warehouses, get_stock, get_expiring_lots, get_expired_lots, get_below_minimum, get_transfers] }
                filters: { type: object, additionalProperties: true }
                count: { type: integer }
                truncated: { type: boolean }
                rows: { type: array, items: { type: object, additionalProperties: true } }
